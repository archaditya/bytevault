<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body style="margin: 0; padding: 0; background: #0a0c10">
    <div
      style="
        font-family: &quot;Inter&quot;, Arial, sans-serif;
        max-width: 480px;
        margin: 0 auto;
        padding: 40px 24px;
        background: #0d0f12;
        color: #e2e4e9;
        border-radius: 12px;
      "
    >
      <div style="text-align: center; margin-bottom: 32px">
        <div
          style="
            display: inline-block;
            background: #6c5ce7;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 700;
            color: white;
          "
        >
          BV
        </div>
      </div>
      <h1
        style="
          font-size: 22px;
          font-weight: 700;
          margin: 0 0 8px;
          color: #f0f1f3;
        "
      >
        {{.Heading}}
      </h1>
      <p style="font-size: 14px; color: #8b8f96; margin: 0 0 24px">
        {{.Message}}
      </p>
      {{if .OTP}}
      <div
        style="
          background: #181b22;
          border: 1px solid #2a2d35;
          border-radius: 10px;
          padding: 24px;
          text-align: center;
          margin-bottom: 24px;
        "
      >
        <span
          style="
            font-family: &quot;JetBrains Mono&quot;, monospace;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 8px;
            color: white;
          "
          >{{.OTP}}</span
        >
      </div>
      {{end}} {{if .Body}}
      <div style="font-size: 14px; color: #c4c7cc; margin-bottom: 24px">
        {{.Body}}
      </div>
      {{end}}
      <p style="font-size: 13px; color: #6b6f76; margin: 0">{{.Footer}}</p>
    </div>
  </body>
</html>
