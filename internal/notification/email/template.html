<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
</head>

<body style="margin: 0; padding: 0; background: #0a0c10">
  <div style="
        font-family: &quot;Inter&quot;, Arial, sans-serif;
        max-width: 480px;
        margin: 0 auto;
        padding: 40px 24px;
        background: #0d0f12;
        color: #e2e4e9;
        border-radius: 12px;
      ">
    <div style="text-align: center; margin-bottom: 28px">
      <a href="{{if .AppURL}}{{.AppURL}}{{else}}https://pushpostvault.com{{end}}" target="_blank"
        style="text-decoration: none; display: inline-block;">
        <img src="{{if .LogoURL}}{{.LogoURL}}{{else}}https://pushpostvault.com/PushPostVault-logo.png{{end}}"
          alt="PushPostVault" width="200"
          style="display: block; margin: 0 auto; max-width: 200px; height: auto; border: 0; outline: none; text-decoration: none; font-family: 'Inter', Arial, sans-serif; font-size: 20px; font-weight: 700; color: #ffffff;" />
      </a>
    </div>
    <h1 style="
          font-size: 22px;
          font-weight: 700;
          margin: 0 0 8px;
          color: #f0f1f3;
        ">
      {{.Heading}}
    </h1>
    <p style="font-size: 14px; color: #8b8f96; margin: 0 0 24px">
      {{.Message}}
    </p>
    {{if .OTP}}
    <div style="
          background: #181b22;
          border: 1px solid #2a2d35;
          border-radius: 10px;
          padding: 24px;
          text-align: center;
          margin-bottom: 24px;
        ">
      <span style="
            font-family: &quot;JetBrains Mono&quot;, monospace;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 8px;
            color: white;
          ">{{.OTP}}</span>
    </div>
    {{end}} {{if .Body}}
    <div style="font-size: 14px; color: #c4c7cc; margin-bottom: 24px">
      {{.Body}}
    </div>
    {{end}}
    <p style="font-size: 13px; color: #6b6f76; margin: 0">{{.Footer}}</p>
  </div>
</body>

</html>
